<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة الكاشير — الكافتيريا</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: linear-gradient(135deg, #0f766e 0%, #14b8a6 40%, #2dd4bf 70%, #5eead4 100%);
            background-attachment: fixed;
            color: #ecfdf5;
            padding: 16px;
            position: relative;
        }
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1;
        }
        body::before { width: 400px; height: 400px; background: rgba(45,212,191,.5); top: -100px; right: -100px; }
        body::after { width: 500px; height: 500px; background: rgba(20,184,166,.4); bottom: -150px; left: -150px; }

        /* ===== شاشة تسجيل الدخول ===== */
        #login-screen {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 16px;
        }
        .login-card {
            background: rgba(255,255,255,.18);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 24px; padding: 36px 32px; width: 100%; max-width: 400px;
            box-shadow: 0 16px 48px rgba(0,0,0,.2);
        }
        .login-brand { text-align: center; font-size: 2rem; font-weight: 800; margin-bottom: 6px; letter-spacing: 1px; }
        .login-sub { text-align: center; font-size: .9rem; opacity: .75; margin-bottom: 28px; }
        .login-card label { display: block; margin-bottom: 14px; font-size: .9rem; font-weight: 600; }
        .login-card input {
            display: block; width: 100%; margin-top: 6px; padding: 11px 14px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,.35);
            background: rgba(255,255,255,.18); color: #fff; font-size: 1rem; outline: none;
        }
        .login-card input::placeholder { color: rgba(255,255,255,.55); }
        .login-card input:focus { border-color: rgba(255,255,255,.7); background: rgba(255,255,255,.25); }
        .login-btn {
            width: 100%; margin-top: 20px; padding: 13px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,.3);
            background: linear-gradient(135deg,#10b981,#047857);
            color: #fff; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 20px rgba(16,185,129,.4); transition: .2s;
        }
        .login-btn:hover { background: linear-gradient(135deg,#047857,#065f46); transform: scale(1.02); }
        .login-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .login-error {
            margin-top: 14px; padding: 10px 14px; border-radius: 10px;
            background: rgba(239,68,68,.25); border: 1px solid rgba(239,68,68,.4);
            color: #fecaca; font-size: .9rem; text-align: center;
        }

        /* ===== شاشة الكاشير ===== */
        #cashier-screen { display: none; }

        header {
            text-align: center;
            background: rgba(255,255,255,.15);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.3);
            color: white; padding: 18px 25px; border-radius: 20px; margin-bottom: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,.1);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        header h1 { font-size: 1.4rem; text-shadow: 0 2px 10px rgba(0,0,0,.2); }
        header .sub { font-size: .85rem; opacity: .85; }
        .status-chip { font-size: .8rem; background: rgba(255,255,255,.18); padding: 6px 12px; border-radius: 999px; }
        .logout-chip {
            font-size: .8rem; padding: 6px 14px; border-radius: 999px; cursor: pointer;
            background: rgba(239,68,68,.25); border: 1px solid rgba(239,68,68,.4);
            color: #fecaca; transition: .2s;
        }
        .logout-chip:hover { background: rgba(239,68,68,.4); }

        .pos-body {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 18px;
            align-items: start;
        }
        @media (max-width: 960px) { .pos-body { grid-template-columns: 1fr; } }

        .section {
            background: rgba(255,255,255,.15);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.3);
            padding: 18px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,.1);
        }
        .section h2 {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid rgba(255,255,255,.3); padding-bottom: 10px; margin-bottom: 14px; font-size: 1.1rem;
        }
        .search-box {
            width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.35);
            background: rgba(255,255,255,.18); color: #fff; font-size: 1rem; margin-bottom: 14px; outline: none;
        }
        .search-box::placeholder { color: rgba(255,255,255,.6); }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; max-height: 68vh; overflow-y: auto; }
        .menu-card {
            background: rgba(255,255,255,.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.3); border-radius: 15px; overflow: hidden; cursor: pointer;
            transition: .25s; display: flex; flex-direction: column; text-align: center; color: #fff;
        }
        .menu-card:hover { transform: translateY(-3px); background: rgba(255,255,255,.28); box-shadow: 0 10px 25px rgba(0,0,0,.2); }
        .menu-card img { width: 100%; height: 90px; object-fit: cover; background: rgba(0,0,0,.1); }
        .menu-card .no-img { height: 90px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.1); font-size: .75rem; color: rgba(255,255,255,.6); }
        .menu-card .name { font-weight: 700; font-size: .95rem; padding: 8px 8px 0; }
        .menu-card .price { color: #a7f3d0; font-weight: bold; font-size: 1rem; padding: 4px 8px 10px; }

        .basket-list { display: flex; flex-direction: column; gap: 10px; max-height: 44vh; overflow-y: auto; }
        .basket-row { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); border-radius: 14px; padding: 10px 12px; }
        .basket-row .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .basket-row .head .nm { font-weight: bold; }
        .basket-row .head .pr { color: #a7f3d0; font-weight: bold; }
        .extras-wrap { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
        .extra-tag { background: linear-gradient(135deg,#10b981,#059669); color: #fff; padding: 2px 8px; border-radius: 6px; font-size: .72rem; border: 1px solid rgba(255,255,255,.2); }
        .controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: linear-gradient(135deg,#10b981,#059669); color: #fff; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .qty-display { font-weight: bold; min-width: 20px; text-align: center; }
        .del-btn { background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; border: 1px solid rgba(255,255,255,.3); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: .8rem; margin-right: auto; }
        .empty-msg { text-align: center; color: rgba(255,255,255,.6); padding: 20px; font-style: italic; }

        .total-section { margin-top: 14px; padding-top: 12px; border-top: 2px dashed rgba(255,255,255,.3); display: flex; justify-content: space-between; align-items: center; font-size: 1.25rem; font-weight: bold; }
        #total-price { color: #a7f3d0; }

        .checkout-btn {
            width: 100%; margin-top: 12px; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3);
            background: linear-gradient(135deg,#10b981,#047857); color: #fff; font-size: 1.15rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 20px rgba(16,185,129,.4); transition: .25s;
        }
        .checkout-btn:hover { transform: scale(1.02); background: linear-gradient(135deg,#047857,#065f46); }
        .checkout-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .clear-all-btn { background: linear-gradient(135deg,#ef4444,#dc2626); color:#fff; border:1px solid rgba(255,255,255,.3); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:.8rem; }

        .modal { display: none; position: fixed; z-index: 1000; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,.5); backdrop-filter: blur(5px); justify-content:center; align-items:center; }
        .modal-content { background: rgba(255,255,255,.2); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border:1px solid rgba(255,255,255,.4); padding:22px; border-radius:20px; width:92%; max-width:460px; max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:2px solid rgba(255,255,255,.2); padding-bottom:10px; }
        .close-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:#ecfdf5; }
        .opt-item { display:flex; justify-content:space-between; align-items:center; padding:10px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.2); border-radius:10px; margin-bottom:8px; }
        .opt-item label { display:flex; align-items:center; gap:10px; cursor:pointer; flex:1; color:#ecfdf5; }
        .opt-item input[type=checkbox] { width:18px; height:18px; cursor:pointer; accent-color:#10b981; }
        .opt-price { color:#a7f3d0; font-weight:bold; font-size:.85rem; }
        .opt-price.free { color: rgba(255,255,255,.55); font-weight:normal; }
        .modal-footer { display:flex; gap:10px; justify-content:flex-end; }
        .modal-btn { padding:10px 20px; border:1px solid rgba(255,255,255,.3); border-radius:10px; cursor:pointer; font-weight:bold; }
        .modal-btn.cancel { background:rgba(255,255,255,.15); color:#fff; }
        .modal-btn.confirm { background:linear-gradient(135deg,#10b981,#059669); color:#fff; }

        .toast { position: fixed; bottom: 20px; right: 50%; transform: translateX(50%); background: rgba(255,255,255,.25); backdrop-filter: blur(20px); border:1px solid rgba(255,255,255,.4); padding: 14px 24px; border-radius: 14px; z-index: 2000; display: none; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3); min-width: 260px; }
        .toast a { color:#a7f3d0; font-weight:bold; }

        .note-box { width:100%; margin-top:10px; padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.15); color:#fff; font-size:.9rem; }
        .customer-row { display:flex; gap:8px; margin-bottom: 10px; }
        .customer-row input { flex:1; padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.15); color:#fff; font-size:.9rem; }
        .customer-row input::placeholder { color: rgba(255,255,255,.6); }
    </style>
</head>
<body>

    <!-- ===== شاشة تسجيل الدخول ===== -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-brand">☕ كاشير الكافتيريا</div>
            <div class="login-sub">سجّل دخولك للمتابعة</div>
            <form id="login-form" onsubmit="doLogin(event)">
                <label>
                    اسم المستخدم
                    <input id="inp-user" type="text" placeholder="اسم المستخدم" autocomplete="username" required>
                </label>
                <label>
                    كلمة المرور
                    <input id="inp-pass" type="password" placeholder="••••••" autocomplete="current-password" required>
                </label>
                <div id="login-error" class="login-error" style="display:none;"></div>
                <button class="login-btn" id="login-btn" type="submit">دخول</button>
            </form>
        </div>
    </div>

    <!-- ===== شاشة الكاشير ===== -->
    <div id="cashier-screen">
        <header>
            <div>
                <h1>☕ لوحة الكاشير</h1>
                <div class="sub" id="biz-name">جارٍ التحميل…</div>
            </div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <span class="status-chip" id="status-chip">جارٍ التحميل…</span>
                <button class="logout-chip" onclick="doLogout()">تسجيل الخروج ↩</button>
            </div>
        </header>

        <div class="pos-body">
            <!-- قائمة الأصناف -->
            <div class="section">
                <h2>🧆 الأصناف</h2>
                <input class="search-box" id="search" placeholder="🔍 بحث عن صنف…" oninput="renderMenu()">
                <div class="menu-grid" id="menu-grid"></div>
            </div>

            <!-- السلة -->
            <div class="section">
                <h2>
                    🧾 الطلبات
                    <button class="clear-all-btn" onclick="clearAll()">مسح الكل 🗑️</button>
                </h2>
                <div class="customer-row">
                    <input id="client-name" placeholder="اسم العميل (اختياري)">
                    <input id="client-phone" placeholder="الجوال">
                </div>
                <div class="basket-list" id="basket-list"></div>
                <div class="total-section">
                    <span>الإجمالي:</span>
                    <span id="total-price">0 ر.س</span>
                </div>
                <input class="note-box" id="note" placeholder="ملاحظة (اختياري)">
                <button class="checkout-btn" id="checkout-btn" onclick="checkout()">💾 إتمام الفاتورة وحفظها</button>
            </div>
        </div>
    </div>

    <!-- نافذة اختيارات الإضافات -->
    <div id="extras-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-item-name">اختر إضافات الطلب</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="extras-list"></div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeModal()">إلغاء</button>
                <button class="modal-btn confirm" onclick="confirmAdd()">إضافة للطلب ✓</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== إعدادات Supabase ==========
        const SUPA_URL = "https://ohwreqztjzkpgoihkvgb.supabase.co/rest/v1";
        const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9od3JlcXp0anprcGdvaWhrdmdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MzczMzgsImV4cCI6MjEwMzQxMzMzOH0.D8q8tQO-8qhvOVhdi3GU8zChlP9niW9edx7LP0iWlqc";
        const HEADERS = { apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY, Accept: "application/json", "Content-Type": "application/json" };

        // ========== الحالة ==========
        let catalog = [];
        let order = [];
        let selectedItem = null;
        let currentBizId = null;
        let currentBizName = "";

        // تجزئة SHA-256 (مطابق لـ storage.js)
        async function sha256(pw) {
            const data = new TextEncoder().encode(pw);
            const buf = await crypto.subtle.digest("SHA-256", data);
            return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
        }

        function fmt(n) {
            return (Number(n)||0).toLocaleString("ar-SA",{maximumFractionDigits:2}) + " ر.س";
        }
        function esc(s) {
            return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
        }

        // ========== تسجيل الدخول ==========
        async function doLogin(e) {
            e.preventDefault();
            const errEl = document.getElementById("login-error");
            const btn = document.getElementById("login-btn");
            errEl.style.display = "none";
            btn.disabled = true;
            btn.textContent = "جارٍ التحقق…";

            const username = document.getElementById("inp-user").value.trim();
            const password = document.getElementById("inp-pass").value;

            if (!username || !password) {
                showLoginError("أدخل اسم المستخدم وكلمة المرور");
                btn.disabled = false; btn.textContent = "دخول"; return;
            }

            try {
                const hash = await sha256(password);

                // جلب بيانات الحساب من Supabase
                const res = await fetch(
                    SUPA_URL + "/businesses?username=eq." + encodeURIComponent(username) + "&select=id,businessName,businessCategory,password_hash",
                    { headers: HEADERS }
                );
                if (!res.ok) throw new Error("تعذّر الاتصال بالخادم");
                const data = await res.json();

                if (!data || data.length === 0) {
                    showLoginError("اسم المستخدم أو كلمة المرور غير صحيحة");
                    btn.disabled = false; btn.textContent = "دخول"; return;
                }

                const biz = data[0];

                // التحقق من كلمة المرور
                if (biz.password_hash !== hash) {
                    showLoginError("اسم المستخدم أو كلمة المرور غير صحيحة");
                    btn.disabled = false; btn.textContent = "دخول"; return;
                }

                // التحقق من نوع النشاط
                if (biz.businessCategory !== "cafeteria" && biz.businessCategory !== "restaurant") {
                    showLoginError("هذه اللوحة مخصصة للكافتيريا فقط.\nنوع نشاطك الحالي: " + (biz.businessCategory || "غير محدد") + "\nيمكنك تغييره من إعدادات النشاط.");
                    btn.disabled = false; btn.textContent = "دخول"; return;
                }

                // نجح الدخول
                currentBizId = biz.id;
                currentBizName = biz.businessName || "الكافتيريا";
                sessionStorage.setItem("cashier_biz_id", currentBizId);
                sessionStorage.setItem("cashier_biz_name", currentBizName);

                showCashier();
            } catch (err) {
                showLoginError(err.message || "حدث خطأ غير متوقع");
                btn.disabled = false; btn.textContent = "دخول";
            }
        }

        function showLoginError(msg) {
            const el = document.getElementById("login-error");
            el.textContent = msg;
            el.style.display = "block";
        }

        function doLogout() {
            sessionStorage.removeItem("cashier_biz_id");
            sessionStorage.removeItem("cashier_biz_name");
            currentBizId = null;
            currentBizName = "";
            catalog = []; order = [];
            document.getElementById("cashier-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
            document.getElementById("inp-pass").value = "";
            document.getElementById("login-error").style.display = "none";
            document.getElementById("login-btn").disabled = false;
            document.getElementById("login-btn").textContent = "دخول";
        }

        function showCashier() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("cashier-screen").style.display = "block";
            document.getElementById("biz-name").textContent = currentBizName;
            renderBasket();
            loadCatalog();
        }

        // ========== تحميل الأصناف ==========
        async function loadCatalog() {
            document.getElementById("status-chip").textContent = "جارٍ التحميل…";
            try {
                const res = await fetch(
                    SUPA_URL + "/catalog?business_id=eq." + currentBizId + "&select=id,desc,price,qty,image&order=desc.asc",
                    { headers: HEADERS }
                );
                if (!res.ok) throw new Error("HTTP " + res.status);
                catalog = await res.json();
                setStatus(catalog.length + " صنف", false);
                renderMenu();
            } catch (err) {
                setStatus("تعذّر الاتصال", true);
                document.getElementById("menu-grid").innerHTML =
                    '<div class="empty-msg">تعذّر تحميل الأصناف: ' + esc(err.message) + '</div>';
            }
        }

        function setStatus(txt, err) {
            const el = document.getElementById("status-chip");
            el.textContent = txt;
            el.style.background = err
                ? "linear-gradient(135deg,#ef4444,#dc2626)"
                : "rgba(16,185,129,.4)";
        }

        // ========== عرض الأصناف ==========
        function renderMenu() {
            const q = (document.getElementById("search").value || "").trim().toLowerCase();
            const list = catalog.filter(c => !q || (c.desc||"").toLowerCase().includes(q));
            const grid = document.getElementById("menu-grid");
            if (!list.length) { grid.innerHTML = '<div class="empty-msg">لا توجد أصناف مطابقة</div>'; return; }
            grid.innerHTML = list.map(c => `
                <div class="menu-card" onclick="openModal('${esc(c.id)}','${esc(c.desc)}','${c.price}')">
                    ${c.image ? '<img src="'+esc(c.image)+'" alt="">' : '<div class="no-img">بدون صورة</div>'}
                    <div class="name">${esc(c.desc)}</div>
                    <div class="price">${fmt(c.price)}</div>
                </div>
            `).join('');
        }

        // ========== نافذة الإضافات ==========
        const EXTRAS = [
            { name: "كاتشب", price: 1 }, { name: "مايونيز", price: 1 },
            { name: "ثومية", price: 1 }, { name: "صلصة حارة", price: 1 },
            { name: "جبن ذائب", price: 2 }, { name: "جبنة شيدر", price: 2 },
            { name: "بيضة", price: 2 }, { name: "بدون مايونيز", price: 0 },
            { name: "بدون بصل", price: 0 }, { name: "بدون كتشب", price: 0 },
            { name: "بدون ملح", price: 0 }, { name: "بدون سكر", price: 0 },
            { name: "بدون جبن", price: 0 }, { name: "بدون طماطم", price: 0 }
        ];

        function openModal(id, name, price) {
            selectedItem = { id, name, price: Number(price)||0, image: (catalog.find(c=>c.id===id)||{}).image||"" };
            document.getElementById("modal-item-name").innerText = "إضافات: " + name;
            document.getElementById("extras-list").innerHTML = EXTRAS.map(o =>
                `<div class="opt-item">
                    <label><input type="checkbox" value="${esc(o.name)}" data-price="${o.price}"> ${esc(o.name)}</label>
                    <span class="opt-price ${o.price===0?'free':''}">${o.price>0?'+'+fmt(o.price):'مجاني'}</span>
                </div>`
            ).join('');
            document.getElementById("extras-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("extras-modal").style.display = "none";
            selectedItem = null;
        }

        function confirmAdd() {
            if (!selectedItem) return;
            const chosen = Array.from(document.querySelectorAll('#extras-list input:checked'))
                .map(cb => ({ name: cb.value, price: Number(cb.dataset.price)||0 }));
            const idx = order.findIndex(it =>
                it.desc === selectedItem.name &&
                JSON.stringify(it.extras||[]) === JSON.stringify(chosen)
            );
            if (idx !== -1) {
                order[idx].qty += 1;
            } else {
                order.push({ desc: selectedItem.name, price: selectedItem.price, image: selectedItem.image, extras: chosen, qty: 1 });
            }
            renderBasket();
            closeModal();
        }

        // ========== السلة ==========
        function itemTotal(it) {
            const ex = (it.extras||[]).reduce((s,e)=>s+e.price,0);
            return it.qty * ((Number(it.price)||0) + ex);
        }
        function addQty(i, d) { order[i].qty += d; if (order[i].qty <= 0) order.splice(i,1); renderBasket(); }
        function delItem(i) { order.splice(i,1); renderBasket(); }
        function clearAll() {
            if (!order.length) return;
            if (confirm("مسح جميع الطلبات؟")) { order=[]; renderBasket(); }
        }

        function renderBasket() {
            const list = document.getElementById("basket-list");
            if (!order.length) {
                list.innerHTML = '<div class="empty-msg">السلة فارغة…</div>';
            } else {
                list.innerHTML = order.map((it,i) => `
                    <div class="basket-row">
                        <div class="head">
                            <span class="nm">${esc(it.desc)}</span>
                            <span class="pr">${fmt(itemTotal(it))}</span>
                        </div>
                        ${(it.extras||[]).length ? '<div class="extras-wrap">'+it.extras.map(e=>'<span class="extra-tag">'+esc(e.name)+'</span>').join('')+'</div>' : ''}
                        <div class="controls">
                            <button class="qty-btn" onclick="addQty(${i},-1)">-</button>
                            <span class="qty-display">${it.qty}</span>
                            <button class="qty-btn" onclick="addQty(${i},1)">+</button>
                            <button class="del-btn" onclick="delItem(${i})">حذف 🗑️</button>
                        </div>
                    </div>
                `).join('');
            }
            const subtotal = order.reduce((s,it) => s + itemTotal(it), 0);
            document.getElementById("total-price").innerText = fmt(subtotal);
        }

        // ========== إتمام الفاتورة ==========
        async function checkout() {
            if (!order.length) { showToast("أضف أصنافاً أولاً"); return; }
            const btn = document.getElementById("checkout-btn");
            btn.disabled = true; btn.textContent = "جارٍ الحفظ…";
            try {
                // توليد رقم متسلسل
                const allRes = await fetch(SUPA_URL + "/invoices?business_id=eq." + currentBizId + "&select=number", { headers: HEADERS });
                const all = await allRes.json();
                const year = new Date().getFullYear();
                const prefix = "INV-" + year + "-";
                let max = 0;
                all.forEach(inv => {
                    if (typeof inv.number === "string" && inv.number.startsWith(prefix)) {
                        const n = parseInt(inv.number.slice(prefix.length), 10);
                        if (!isNaN(n) && n > max) max = n;
                    }
                });
                const number = prefix + String(max + 1).padStart(4, "0");

                const now = new Date();
                const invoice = {
                    id: number,
                    business_id: currentBizId,
                    number,
                    date: now.toISOString().slice(0,10),
                    time: now.toTimeString().slice(0,5),
                    dueDate: null,
                    clientName: document.getElementById("client-name").value || "",
                    clientPhone: document.getElementById("client-phone").value || "",
                    clientEmail: "",
                    items: order.map(it => ({
                        desc: it.desc, qty: it.qty, price: it.price,
                        image: it.image||"", extras: it.extras||[]
                    })),
                    status: "paid",
                    amended: false,
                    revisedAt: null,
                    note: document.getElementById("note").value || "",
                    createdAt: now.toISOString()
                };

                const res = await fetch(SUPA_URL + "/invoices", {
                    method: "POST",
                    headers: { ...HEADERS, "Prefer": "resolution=merge-duplicates,return=representation" },
                    body: JSON.stringify(invoice)
                });
                if (!res.ok) throw new Error("فشل الحفظ: " + res.status + " " + (await res.text()).slice(0,120));

                order = [];
                renderBasket();
                document.getElementById("client-name").value = "";
                document.getElementById("client-phone").value = "";
                document.getElementById("note").value = "";
                showToast('✅ تم حفظ الفاتورة <b>' + number + '</b> &nbsp;<a href="index.html#/i/' + number + '" target="_blank">عرض الفاتورة</a>');
                setTimeout(() => window.open("index.html#/i/" + number, "_blank"), 400);
            } catch (err) {
                showToast("❌ خطأ: " + err.message);
            } finally {
                btn.disabled = false; btn.textContent = "💾 إتمام الفاتورة وحفظها";
            }
        }

        function showToast(html) {
            const t = document.getElementById("toast");
            t.innerHTML = html; t.style.display = "block";
            setTimeout(() => t.style.display = "none", 6000);
        }

        window.onclick = (e) => {
            if (e.target === document.getElementById("extras-modal")) closeModal();
        };

        // ========== تحقق من الجلسة عند فتح الصفحة ==========
        (function init() {
            const savedId = sessionStorage.getItem("cashier_biz_id");
            const savedName = sessionStorage.getItem("cashier_biz_name");
            if (savedId) {
                currentBizId = savedId;
                currentBizName = savedName || "الكافتيريا";
                showCashier();
            }
        })();
    </script>
</body>
</html>
